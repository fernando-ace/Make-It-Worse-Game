name: Party Night beta candidate

on:
  push:
    branches: [feat/party-night-2-beta-candidate]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:simulation
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-placeholder
          SUPABASE_SECRET_KEY: local-build-placeholder

  browser-multibeat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [cross-my-heart, signal-noise, last-seats, breaking-point]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start ephemeral Supabase and apply migrations
        run: |
          npx supabase start --exclude studio,logflare,vector,edge-runtime,storage-api,postgres-meta,functions
          npx supabase db reset
          npx supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "E2E_TEST_MODE=1" >> "$GITHUB_ENV"
          echo "E2E_TEST_GAME_ID=${{ matrix.game }}" >> "$GITHUB_ENV"
          echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
      - run: npm run test:party-night-e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.game }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
      - if: always()
        run: npx supabase stop --no-backup

  browser-session:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start ephemeral Supabase and apply migrations
        run: |
          npx supabase start --exclude studio,logflare,vector,edge-runtime,storage-api,postgres-meta,functions
          npx supabase db reset
          npx supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
      - run: npm run test:live
      - run: npm run test:party
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-session
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
      - if: always()
        run: npx supabase stop --no-backup
